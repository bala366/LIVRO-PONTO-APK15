plugins {
    id 'com.android.application'
}

android {
    namespace 'com.livroponto.digital'
    compileSdk 35

    defaultConfig {
        applicationId 'com.livroponto.digital'
        minSdk 24
        targetSdk 35
        versionCode 15
        versionName '15.0'
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
